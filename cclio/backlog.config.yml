project_name: "cclio-pocket"
default_status: "open"
statuses: ["open", "claimed", "waiting", "done"]
labels: ["xs", "s", "m"]
# types (dima, 2026-10-10): wish = born from dima's ask, his words kept (the ask-guard holds) · task = cclio's own chore
# research = a question answered from sources · grill = a decision shaped with dima · test-drive = a tool on trial
# idea = not yet shaped, worth keeping · question = something dima asked, answered in place
types: ["task", "research", "grill", "test-drive", "idea", "wish", "question"]
priorities: ["now", "next", "later"]
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "nvim"
auto_open_browser: false
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "pk"
backlog_directory: "pocket"
