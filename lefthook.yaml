# Git hooks. Everything fast enough to gate a commit runs at commit; the slower
# whole-repo dogfood runs on push.
#
# lefthook installs these into this repo's own `.git/hooks`, which is where it
# expects to write and where git looks by default. Nothing is global: there is no
# `core.hooksPath`, so nothing else can claim the slot and nothing here reaches
# another repo.
#
# Nothing here writes to your files. A hook that reformats while lefthook is
# holding your unstaged changes aside can fail to put them back — it cost a file
# once already. Hooks report; you fix.

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,html,css,svg}"
      # --max-diagnostics keeps a failure READABLE. Without it biome prints
      # dozens of diagnostics, then "the number exceeds the limit", and the
      # actual cause scrolls off above lefthook's summary — the commit looks
      # like it just did not happen. That has cost two sessions.
      run: pnpm exec biome check --no-errors-on-unmatched --max-diagnostics=5 {staged_files}
    # typecheck, test and mods read a temp copy of the index (script/index-run.sh): a peer session's half-done
    # edit in the shared checkout never blocks another session's commit (FRM-367)
    typecheck:
      run: script/index-run.sh pnpm typecheck
    test:
      # every branch kind (main, codie/*, clio-wing-*, worktree-*, any other): only the tests related to the staged code, or none when the
      # import graph cannot judge; the whole suite stays at push and on ci. the kill rule's lever, related_kinds in script/test-commit.sh,
      # is the one whole run left at commit
      run: script/index-run.sh script/test-commit.sh pnpm test
    x-go-reads:
      # a staged script x/go's tests read (script/lib/x-go-reads.txt, or anything under script/lib/) runs those tests here,
      # uncached: go's test cache cannot see a file outside the module, and ci was the first to see it (11-06, FRM-520).
      # only awk's «no hit» skips the run: a list it cannot read (a delete, a rename) runs the tests, and a staged read that
      # fails hands awk a path under script/lib/, a hit, so it runs them too
      run: 'script/index-run.sh sh -c "{ git diff --cached --name-only --no-renames || echo script/lib/staged-read-failed; } | awk ''NR == FNR { if (\$0 ~ /\/\$/) under[\$0]; else listed[\$0]; next } \$0 in listed || index(\$0, \"script/lib/\") == 1 { hit = 1 } { for (dir in under) if (index(\$0, dir) == 1) hit = 1 } END { exit !hit }'' script/lib/x-go-reads.txt -; [ \$? -ne 1 ] || exit 0; cd x/go && GIT_CONFIG_GLOBAL=/dev/null GOFLAGS=-buildvcs=false ../../script/test-cpu-budget.sh --log-only x-go go test -count=1 ./..."'
    mods:
      # the mods sit outside vitest and the root tsconfig: their own runner and their engine-written types gate them.
      # a cc bump made fields required and 11 test fixtures went untyped for days before this ran (2026-10-08)
      # no mods test, typecheck or skew reads an .md: a doc-only commit runs no suite (W211)
      glob: "home/.claude/plugin-x/mods/**"
      exclude:
        - "**/*.md"
      run: script/index-run.sh sh -c 'pnpm mods:typecheck && pnpm mods:skew'
    mods-test:
      # commit-only: `x mods edit test` runs a touched mod's tests itself and names this gate as the commit's;
      # --skip-tested passes a mod whose bytes a green overlay or an earlier hook already read, so its tests run once a chain
      tags: [commit-only]
      glob: "home/.claude/plugin-x/mods/**"
      exclude:
        - "**/*.md"
      run: script/index-run.sh pnpm mods:test --skip-tested
    fleet-hazards:
      # a stumble becomes a guard, never a note (FRM-314): a hazard line added or reworded names its guard
      glob: "home/.claude/rules/fleet-hazards*.md"
      run: node script/fleet-hazards-check.ts
    memory-lint:
      # memory rots at write time and a sweep cleans it months later: a size budget per memory file (a useful add
      # raises its row in recipes/nurture-memory/scripts/memory-budgets.tsv with a reason, in the same commit),
      # merged bullets, a new memory file with no row, a row whose file is gone. no glob: the memory set lives in the script
      run: node recipes/nurture-memory/scripts/memory-lint.ts {staged_files}
    surface-mirror:
      # the herdr and desktop leaves keep one heading list in one order, so a line's home in one names its home in the other
      glob:
        - "_clio/memory/surface-*-desktop.md"
        - "_clio/script/surface-mirror-check.ts"
      run: script/index-run.sh node _clio/script/surface-mirror-check.ts
    git-crypt-rename:
      # a git-crypt file moved to a path no filter line covers ships plaintext — d1bddfb5 put one on
      # public main (2026-10-07). no glob: the moved file can live anywhere
      run: node script/git-crypt-rename-check.ts
    chords-essentials:
      # chords is the one app outside bytes; the essentials list lives once, in bytes' checker
      # (BYT-111), so frame calls it by path. a mac without bytes checked out skips, never blocks.
      glob: "hotkeys/chords/**"
      run: test -f "$HOME/projects/bytes/script/apps-essentials.ts" || exit 0; node "$HOME/projects/bytes/script/apps-essentials.ts" --app hotkeys/chords
    speak-essentials:
      # the voice admin, frame's second app outside bytes; same checker, same skip on a mac without bytes
      glob: "speak/**"
      run: test -f "$HOME/projects/bytes/script/apps-essentials.ts" || exit 0; node "$HOME/projects/bytes/script/apps-essentials.ts" --app ./speak

pre-push:
  parallel: true
  commands:
    runner-twin:
      # vitest in a clean clone with an empty HOME and CI=1, the way the ubuntu runner reads the
      # repo: a test that leans on dima's mac (a ~/ path, a git-crypt plaintext) goes red here
      # instead of on main. ~8 s, node_modules symlinked (pk-43, 2026-10-09).
      # stdin names the pushed commit: a worktree's push runs from the main checkout, so HEAD is the wrong one.
      # only a main push carrying code runs it; a branch push and a pocket, memory or .md main push skip (FRM-557)
      use_stdin: true
      run: pnpm test:twin
    mirror:
      # The engine's own dogfood: if the manifest stops deriving, catch it here
      # rather than on the next machine.
      run: pnpm frame:link

commit-msg:
  commands:
    commit-msg-lint:
      # the x:cmt format, refused before the commit lands: emoji canon, a domain scope, no closing
      # keyword beside a ticket id — script/lib/commit-msg-lint.ts holds the rules and why each blocks.
      # it runs from the commit's index copy: from the working tree, a peer's half-done lint edit blocked every commit (11-09)
      run: m={1}; case $m in /*) ;; *) m=$PWD/$m ;; esac; script/index-run.sh node ./script/commit-msg-lint.ts "$m"
    lane-gate:
      # a remembered rule fails, a gate does not (FRM-367): a context's contract lands with its glossary or adr,
      # a crew-/guide- skill never only grows, an app's code lands with its FTR.md — each half has a message line
      # that passes it on purpose. bytes runs the same verb; an x missing from PATH fails loud (exit 127)
      run: x lane gate {1}
    session-trailer:
      # The desktop harness asks every session to end commit messages with a
      # `Claude-Session: https://claude.ai/...` trailer. Nobody reads it — the
      # `Agent:` trailer is the fingerprint — and `attribution.commit: ""` in
      # settings.json does not cover it. {1} is the message file; this is the
      # one hook that edits, and it edits only that file.
      run: perl -i -ne 'print unless /^Claude-Session:/' {1}
    no-ci-skip-marker:
      # GitHub honours a CI-skip marker anywhere in a commit message, body
      # included, and creates no push or pull_request run for that head — the
      # PR then sits blocked with nothing red. Writing ABOUT the marker is using
      # it (bytes #84, 2026-09-12, twenty minutes). Say «the skip directive».
      run: |
        if grep -qiE '\[(skip[ -]?(ci|actions)|(ci|actions)[ -]?skip|no[ -]?ci)\]|skip-checks:[[:space:]]*true' {1}; then
          echo "commit-msg: this message contains a CI-skip marker; write «the skip directive» in prose instead."
          exit 1
        fi
    agent-trailer:
      # an agent's commit gets `Agent: <role> · <model>` here, because `attribution.commit: ""`
      # tells every model to write no attribution line — the why: script/commit-agent-trailer.ts.
      # last in the block (commit-msg runs in sequence), and a human commit is left untouched
      # from the commit's index copy too, like the lint above; the message path is made absolute before the copy moves the cwd
      run: m={1}; case $m in /*) ;; *) m=$PWD/$m ;; esac; script/index-run.sh node ./script/commit-agent-trailer.ts "$m"
