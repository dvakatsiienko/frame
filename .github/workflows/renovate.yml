name: renovate

# renovate runs here, on a free public-repo runner, instead of the Mend app: Mend's 3 GB box
# died in bytes' `pnpm install --lockfile-only`, and nothing opened there for two weeks while
# the digest read the silence as quiet. the rules live in `renovate/default.json` (frame) and
# each repo's `renovate.json`; this file only decides WHEN renovate wakes.
#
# the cron is hourly on purpose: renovate's own `schedule` in the preset decides what opens.
# 📌 github delivers about 4 of these 24 ticks a day, one every ~6 h: a once-a-week window
# narrower than ~12 h gets fewer than two wakes a week, so the preset sizes its windows from that.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: renovate log level
        type: choice
        options: [info, debug]
        default: info
      force:
        description: ignore the schedules and open every pr now
        type: boolean
        default: false

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # holds RENOVATE_APP_KEY, which pushes workflows: github refuses this job on any branch but main
    environment: renovate-main-only

    permissions:
      contents: read

    steps:
      # 📌 our own App's token, never `GITHUB_TOKEN`: a push made with `GITHUB_TOKEN` starts no
      # workflow, so renovate's branches and prs would carry no CI and automerge would wait on
      # it forever. the app, `x-renovate`, is installed on frame and bytes only, with
      # Contents, Pull requests, Issues, Workflows: write and Checks, Commit statuses, Dependabot
      # alerts: read (renovate reads the alerts to open its security prs).
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_FORCE: ${{ inputs.force && '{"schedule":[]}' || '{}' }}
