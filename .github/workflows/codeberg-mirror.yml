name: codeberg mirror

# pushes every branch and tag to codeberg.org/dvakatsiienko/<this repo>, the backup off github.
# the nightly run catches pushes made by github's own token, which never trigger a workflow.
on:
  push:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: codeberg-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: mirror to codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          REPO: ${{ github.event.repository.name }}
        run: |
          git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" src
          cd src
          dest="https://dvakatsiienko:${CODEBERG_TOKEN}@codeberg.org/dvakatsiienko/${REPO}.git"
          # a backup never mirrors destruction: no prune, and main + tags only fast-forward, so a rewrite turns this run red
          # codeberg answers 504 now and then (6 red runs 11-10..11-11, all 504); any failed push is retried, so a rejected one goes red after ~3.5 min
          retry() { for wait in 30 60 120; do "$@" && return 0; echo "retrying in ${wait}s"; sleep "$wait"; done; "$@"; }
          retry git push "$dest" '+refs/heads/*:refs/heads/*' '^refs/heads/main'
          retry git push "$dest" 'refs/heads/main:refs/heads/main' 'refs/tags/*:refs/tags/*'
