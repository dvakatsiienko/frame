name: review

# The ci reviewer for frame, one round per PR at «final». The round lives in
# bytes' `review-round.yml`, shared with bytes; bytes' own `review.yml` carries
# the measured reasons for the trigger, concurrency key and job name kept here.
#
# 📌 Named `review.yml` on purpose: the cap counts successful runs of the
# calling file, and `x lane review` reads `review.yml` runs in the repo it runs
# in. ONE trigger, ONE job: a second job here would make its events count as
# rounds.
on:
  pull_request:
    types: [labeled]

# The key answers «is THIS event asking for a review»: an unrelated label lands
# in its own group and never cancels a live round.
concurrency:
  group: review-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && github.event.label.name == '🤖 review:requested' }}
  cancel-in-progress: true

jobs:
  review-round:
    # A job-level `if`: an unrelated label never starts the job at all.
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == '🤖 review:requested'
    # At bytes `main`; that file's header says what the pin holds and what it does not.
    uses: dvakatsiienko/bytes/.github/workflows/review-round.yml@main
    # A called workflow can only narrow the token it is handed, so the caller
    # grants everything the round needs.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
      checks: write
    with:
      app-id: ${{ vars.X_REVIEWER_CC_APP_ID }}
    secrets:
      X_REVIEWER_CC_PRIVATE_KEY: ${{ secrets.X_REVIEWER_CC_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
