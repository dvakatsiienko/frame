name: CI

on:
  pull_request:
  push:
    # `renovate/**` is required, not decorative. renovate.json sets
    # `prCreation: "not-pending"`, which holds a PR back until the branch's
    # checks finish — and a branch carrying no checks reads as pending forever,
    # so the PR would never open. Running CI on the bare branch is also what
    # makes patch automerge mean something here.
    branches: [main, 'renovate/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: 1

jobs:
  check:
    name: check + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # Version comes from `packageManager` in package.json, so there is no
      # number to keep in step with by hand and renovate can bump it.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # GitHub Actions sets CI=true itself, which is what makes lefthook's
      # postinstall exit early instead of rewriting the git hook shims.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Renovate's config is only read by renovate, on its own schedule, so a
      # typo would sit undetected until someone noticed the bot going quiet.
      # This catches an unknown key or a wrong shape. No filename argument on
      # purpose — the docs say passing one makes the validator treat the file as
      # global self-hosted config, and the bare form auto-detects renovate.json
      # as repo config, which is what it is.
      #
      # It cannot catch a semantically wrong config: a rule that parses fine and
      # matches nothing stays green here.
      - name: Validate renovate config
        run: npx --yes --package renovate -- renovate-config-validator --strict

      # `biome ci`, not the repo's own `check` script: that one is
      # `biome check --write`, which rewrites files rather than failing on them,
      # so it can never report a problem from CI.
      - name: Check
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      # x's go tests lock a git-crypt fixture worktree, so the tool must exist here
      # or the run fails instead of skipping
      - name: Install git-crypt
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends git-crypt

      - name: Test
        run: pnpm test

      # sline is a Go module, and renovate.json turns the gomod manager on for
      # it. Without these steps a Go update would merge with nothing having
      # compiled it.
      - uses: actions/setup-go@v7
        with:
          go-version-file: home/.claude/sline/go.mod

      # `go test` compiles as well as runs, so this covers what a toolchain bump
      # risks and the behaviour too. The one assertion that needs a real
      # ~/.claude now skips itself instead of failing here.
      - name: Test sline
        run: pnpm sline:test

      # x is go too, on a newer go than sline's; its tests run every calls.json call, tty ones on a pty
      - uses: actions/setup-go@v7
        with:
          go-version-file: x/go/go.mod

      - name: Test x
        run: pnpm x-go:test

  # The readme's ci badge in the repo's own style, redrawn after every main run. It lives on an
  # orphan `badges` branch, one commit force-replaced each time, so a status never lands in
  # main's history. A cancelled run is skipped: superseded is not failed.
  badge:
    name: ci badge
    needs: check
    if: always() && needs.check.result != 'cancelled' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Draw and publish
        env:
          RESULT: ${{ needs.check.result }}
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node script/badges-sync.ts --ci "$RESULT" /tmp/badge
          cd /tmp/badge
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci.svg
          git commit -q -m "ci badge: $RESULT"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$REPO.git" badges
