#   2. repo-root config OUTRANKS the global file, so if this repo ever needs
#      different behaviour, this is already the place to change it.
# precedence: ./linear.toml > <repo-root>/linear.toml > ~/.config/linear/.
#
# the matching rule for agents lives in home/.claude/rules-lazy/linear-flow.md.
issue_create_assign_self = "never"
