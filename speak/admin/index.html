<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1" name="viewport" >
<title>x-speak voices</title>
<style>
:root {
    --bg: #f6f5f2; --surface: #ffffff; --surface-2: #efede8; --text: #1c1b19; --muted: #5d5a53;
    --line: #d8d4cb; --accent: #3d5a98; --accent-text: #ffffff; --ok: #2f6b3a; --warn: #8a5a00; --bad: #a33a2a;
    --focus: #3d5a98;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px;
    color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #121212; --surface: #1d1d1f; --surface-2: #262628; --text: #ecebe8; --muted: #a9a59c;
        --line: #3a3a3d; --accent: #8fa8e0; --accent-text: #121212; --ok: #8cc79a; --warn: #e0b35c; --bad: #ec8a78;
        --focus: #8fa8e0;
    }
}
* { box-sizing: border-box; }
/* tab focus scrolls clear of the sticky save bar */
html { scroll-padding-bottom: 88px; }
h1 { margin: 0; font-size: 18px; }
body { margin: 0; font: 15px/1.45 -apple-system, system-ui, sans-serif; color: var(--text); background: var(--bg); }
::selection { color: var(--accent-text); background: var(--accent); }
header, main, footer { max-width: 1280px; padding: var(--s4); margin: 0 auto; }
header { display: flex; flex-wrap: wrap; gap: var(--s4); align-items: center; }
header a.home { font-size: 18px; font-weight: 700; color: var(--text); text-decoration: none; cursor: pointer; }
header a.home:hover { text-decoration: underline; }
.health { font-size: 14px; color: var(--muted); }
main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s4); }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
section h2 { margin: 0 0 var(--s2); font-size: 16px; }
label.sample { display: block; margin-bottom: var(--s3); font-size: 14px; color: var(--muted); }
label.sample > input { display: block; width: 100%; margin-top: var(--s1); }
input[type=text], input[type=number], select {
    padding: var(--s1) var(--s2); 
    font: inherit; font-size: 14px; color: var(--text); cursor: text;background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px;
}
select { width: 100%; cursor: pointer; }
button {
    min-width: 32px; min-height: 32px; padding: var(--s1) var(--s3); 
    font: inherit; font-size: 14px; color: var(--text); cursor: pointer;background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 6px;
}
button:hover { background: var(--surface); border-color: var(--muted); }
button:disabled { cursor: not-allowed; opacity: 0.5; }
button.primary { font-weight: 600; color: var(--accent-text); background: var(--accent); border-color: var(--accent); }
button.primary:hover { filter: brightness(1.08); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
ol { display: grid; gap: var(--s2); padding: 0; margin: 0; list-style: none; }
.card { display: grid; gap: var(--s2); padding: var(--s3); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.card.off { background: transparent; border-style: dashed; }
.card.off .settings { display: none; }
.card.drop { border-color: var(--accent); border-width: 2px; }
.row { display: flex; gap: var(--s2); align-items: center; }
.handle { padding: 0 var(--s1); font-size: 18px; line-height: 1; color: var(--muted); cursor: grab; user-select: none; }
.handle:active { cursor: grabbing; }
.name { flex: 1; font-weight: 600; }
.rank { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--muted); }
.state { padding: 0 var(--s2); font-size: 14px; border: 1px solid currentColor; border-radius: 4px; }
.state.live { color: var(--ok); } .state.benched { color: var(--warn); } .state.nokey { color: var(--bad); }
.switch { display: inline-flex; gap: var(--s1); align-items: center; font-size: 14px; cursor: pointer; user-select: none; }
.switch input { width: 18px; height: 18px; cursor: pointer; }
.slider { display: grid; grid-template-columns: 48px 1fr 40px; gap: var(--s2); align-items: center; font-size: 14px; color: var(--muted); }
.slider input { width: 100%; height: 24px; cursor: pointer; }
.slider output { font-variant-numeric: tabular-nums; color: var(--text); text-align: right; }
.shared { font-size: 14px; color: var(--muted); }
footer { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; background: var(--bg); border-top: 1px solid var(--line); }
#message { font-size: 14px; user-select: text; }
#message.error { color: var(--bad); } #message.ok { color: var(--ok); }
</style>
</head>
<body>
<header>
    <h1><a class="home" href="/">🔊 x-speak voices</a></h1>
    <label class="shared">first audio budget <input id="budget" max="3000" min="100" step="50" style="width: 88px" type="number" > ms</label>
    <span class="health" id="health">reading the daemon…</span>
    <button id="stop" type="button">■ stop</button>
</header>
<main id="columns"></main>
<footer>
    <button class="primary" disabled id="save" type="button" >save</button>
    <span id="message" role="status">no changes</span>
</footer>
<script type="module">
// an array, not an object: the column order is dima's, and a key sort must not reorder it
const LANGS = [
    ['en', 'english'],
    ['uk', 'українська'],
    ['ru', 'русский'],
];
const ENGINES = ['elevenlabs', 'kokoro', 'system', 'fish', 'gemini'];
const LABELS = { elevenlabs: 'ElevenLabs', fish: 'Fish', gemini: 'Gemini', kokoro: 'Kokoro (local)', system: 'macOS voice' };
const SAMPLES = {
    en: 'FRM-266 shipped in v0.3.85 → see `speak/`',
    ru: 'FRM-266 вышел в v0.3.85 → смотри `speak/`',
    uk: 'FRM-266 вийшов у v0.3.85 → дивись `speak/`',
};
let config, voices, status = {}, isDirty = false;
const samples = { ...SAMPLES };

const api = async (method, path, payload) => {
    const response = await fetch(path, { body: payload && JSON.stringify(payload), headers: { 'content-type': 'application/json' }, method });
    return response.json();
};
const speaks = (engine, lang) => engine !== 'kokoro' || lang === 'en';
const settingsOf = (engine) => (config.engines[engine] ??= { voice: {} });
const voiceOf = (engine, lang) => { const v = settingsOf(engine).voice ?? {}; return v[lang] ?? v['*'] ?? ''; };

function say(text, kind = '') {
    const message = document.getElementById('message');
    message.textContent = text;
    message.className = kind;
}
function touch() {
    isDirty = true;
    document.getElementById('save').disabled = false;
    say('unsaved changes');
    render();
}

function voiceOptions(engine, lang) {
    if (engine === 'system') {
        const installed = (voices.system ?? []).filter((v) => v.lang === lang);
        const base = lang === 'en' ? [['', 'Spoken Content voice (Siri)']] : [['', 'best installed']];
        return [...base, ...installed.map((v) => [v.id, `${v.name} · ${v.quality}`])];
    }
    return voices[engine] ?? [];
}

function stateBadge(engine) {
    const state = status[engine]?.state ?? 'unknown';
    const until = status[engine]?.until ? ` until ${new Date(status[engine].until).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : '';
    const badge = document.createElement('span');
    badge.className = `state ${state.replace(' ', '')}`;
    badge.textContent = state + until;
    return badge;
}

function card(engine, lang, chain) {
    const rank = chain.indexOf(engine);
    const isOn = rank >= 0;
    const settings = settingsOf(engine);
    const li = document.createElement('li');
    li.className = `card${isOn ? '' : ' off'}`;
    li.dataset.engine = engine;
    li.innerHTML = `
        <div class="row">
            ${isOn ? '<span class="handle" title="drag to reorder" draggable="true" aria-hidden="true">⠿</span>' : ''}
            <span class="rank">${isOn ? rank + 1 : '–'}</span>
            <span class="name">${LABELS[engine]}</span>
            <span class="state"></span>
        </div>
        <div class="row">
            <label class="switch"><input type="checkbox" role="switch" ${isOn ? 'checked' : ''} data-act="toggle"> in the ${lang} chain</label>
            <span style="flex: 1"></span>
            ${isOn ? `<button type="button" data-act="up" aria-label="move ${LABELS[engine]} up" ${rank === 0 ? 'disabled' : ''}>↑</button>
            <button type="button" data-act="down" aria-label="move ${LABELS[engine]} down" ${rank === chain.length - 1 ? 'disabled' : ''}>↓</button>` : ''}
            <button type="button" data-act="preview" aria-label="preview ${LABELS[engine]} in ${lang}">▶</button>
        </div>
        <div class="settings">
            <select data-act="voice" aria-label="${LABELS[engine]} voice for ${lang}"></select>
            <div class="slider"><span>speed</span><input type="range" min="0.5" max="2" step="0.05" value="${settings.speed ?? 1}" data-act="speed" aria-label="${LABELS[engine]} speed"><output>${(settings.speed ?? 1).toFixed(2)}</output></div>
            ${engine === 'system' ? '' : `<div class="slider"><span>gain</span><input type="range" min="0" max="4" step="0.1" value="${settings.gain ?? 1}" data-act="gain" aria-label="${LABELS[engine]} gain"><output>${(settings.gain ?? 1).toFixed(1)}</output></div>`}
        </div>`;
    li.querySelector('.state').replaceWith(stateBadge(engine));
    const select = li.querySelector('select');
    for (const [id, name] of voiceOptions(engine, lang)) select.add(new Option(name, id, false, id === voiceOf(engine, lang)));

    li.addEventListener('change', (event) => {
        const act = event.target.dataset.act;
        if (act === 'toggle') {
            if (event.target.checked) chain.push(engine);
            else chain.splice(chain.indexOf(engine), 1);
            return touch();
        }
        if (act === 'voice') {
            settings.voice ??= {};
            if (event.target.value) settings.voice[lang] = event.target.value;
            else delete settings.voice[lang];
            return touch();
        }
        if (act === 'speed' || act === 'gain') {
            settings[act] = Number(event.target.value);
            touch();
        }
    });
    li.addEventListener('input', (event) => {
        const act = event.target.dataset.act;
        if (act === 'speed' || act === 'gain') event.target.nextElementSibling.value = Number(event.target.value).toFixed(act === 'speed' ? 2 : 1);
    });
    li.addEventListener('click', async (event) => {
        const act = event.target.closest('button')?.dataset.act;
        if (act === 'up' || act === 'down') {
            const to = rank + (act === 'up' ? -1 : 1);
            [chain[rank], chain[to]] = [chain[to], chain[rank]];
            touch();
        }
        if (act === 'preview') {
            const voice = voiceOf(engine, lang);
            const reply = await api('POST', '/api/preview', {
                engine,
                settings: { ...settings, voice: voice ? { [lang]: voice } : {} },
                text: samples[lang],
            });
            say(reply.error ?? `▶ ${LABELS[engine]} · ${lang}`, reply.error ? 'error' : '');
        }
    });

    li.addEventListener('dragstart', (event) => event.dataTransfer.setData('text/plain', `${lang}:${engine}`));
    li.addEventListener('dragover', (event) => {
        if (!isOn) return;
        event.preventDefault();
        li.classList.add('drop');
    });
    li.addEventListener('dragleave', () => li.classList.remove('drop'));
    li.addEventListener('drop', (event) => {
        event.preventDefault();
        const [fromLang, moved] = event.dataTransfer.getData('text/plain').split(':');
        if (fromLang !== lang || moved === engine) return render();
        chain.splice(chain.indexOf(moved), 1);
        chain.splice(chain.indexOf(engine), 0, moved);
        touch();
    });
    return li;
}

// a re-render keeps the keyboard where it was: same language, same engine, same control
function focusKey() {
    const active = document.activeElement;
    const section = active?.closest('section');
    if (!section) return null;
    return { act: active.dataset.act, engine: active.closest('[data-engine]')?.dataset.engine, id: active.id, lang: section.id };
}
function restoreFocus(key) {
    if (!key) return;
    const target = key.id ? document.getElementById(key.id)
        : document.querySelector(`#${key.lang} [data-engine=${key.engine}] [data-act=${key.act}]:not(:disabled)`)
            ?? document.querySelector(`#${key.lang} [data-engine=${key.engine}] button:not(:disabled)`);
    target?.focus();
}

function render() {
    const columns = document.getElementById('columns');
    const focused = focusKey();
    columns.replaceChildren(...LANGS.map(([lang, title]) => {
        config.chain[lang] ??= [];
        const chain = config.chain[lang];
        const section = document.createElement('section');
        section.id = `col-${lang}`;
        section.innerHTML = `<h2>${title}</h2><label class="sample">sample line<input type="text" id="sample-${lang}"></label><ol></ol>`;
        const input = section.querySelector('input');
        input.value = samples[lang];
        input.addEventListener('input', () => { samples[lang] = input.value; });
        const available = ENGINES.filter((engine) => speaks(engine, lang));
        const order = [...chain, ...available.filter((engine) => !chain.includes(engine))];
        section.querySelector('ol').append(...order.map((engine) => card(engine, lang, chain)));
        return section;
    }));
    restoreFocus(focused);
    document.getElementById('budget').value = config.firstAudioMs;
}

async function refreshStatus() {
    const reply = await api('GET', '/api/status');
    if (reply.error) {
        document.getElementById('health').textContent = reply.error;
        return;
    }
    status = reply.engines ?? {};
    document.getElementById('health').textContent = `daemon up · accessibility ${reply.accessibility ? 'granted' : 'missing'}${reply.speaking ? ' · speaking' : ''}`;
    for (const badge of document.querySelectorAll('[data-engine] .state')) {
        const engine = badge.closest('[data-engine]').dataset.engine;
        badge.replaceWith(stateBadge(engine));
    }
}

document.getElementById('budget').addEventListener('change', (event) => {
    config.firstAudioMs = Number(event.target.value);
    touch();
});
document.getElementById('stop').addEventListener('click', () => api('POST', '/api/stop'));
document.getElementById('save').addEventListener('click', async () => {
    const reply = await api('PUT', '/api/config', config);
    if (reply.error) return say(`rejected — ${reply.error}`, 'error');
    isDirty = false;
    document.getElementById('save').disabled = true;
    say('saved · the daemon loaded it', 'ok');
});

// status polls only while the tab is visible, and stops with it
let poll;
const startPoll = () => { clearInterval(poll); refreshStatus(); poll = setInterval(refreshStatus, 5000); };
document.addEventListener('visibilitychange', () => (document.hidden ? clearInterval(poll) : startPoll()));

[config, voices] = await Promise.all([api('GET', '/api/config'), api('GET', '/api/voices')]);
render();
startPoll();
</script>
</body>
</html>
