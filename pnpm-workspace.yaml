packages:
  - home/.claude/mcp-x-cloud-chat
  - logos
  - import/raycast/extensions/x-ray

allowBuilds:
  esbuild: true
  lefthook: true
  # mods:live loads node-pty's own darwin-arm64 prebuild, so no node-gyp build; the script sets
  # the prebuilt spawn-helper's exec bit, which the tarball drops
  node-pty: false

# renovate's own gate, in minutes (3 days): pnpm outdated reads it, so it stops listing what renovate may not take yet
minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - biome-config-polished
  - three@0.186.1

autoDedupe: true
# recorded in the lockfile, so pnpm reads a frozen lockfile as up to date and installs nothing before an exec or a run
lockfile:
  includeResolutionSettings: true
